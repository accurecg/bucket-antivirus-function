# Run tests on pull requests
name: Antivirus Tests

on:
  pull_request:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Check certifi trust store
        run: |
          python -c '
          import certifi
          bundle = open(certifi.where(), encoding="utf-8").read()
          blocked = ("emSign ECC Root CA - G3", "AAA Certificate Services")
          found = [name for name in blocked if name in bundle]
          if found:
              raise SystemExit("certifi bundle still trusts: " + ", ".join(found))
          '

      - name: Run tests
        run: make test

      - name: Run pre-commit tests
        run: make pre_commit_tests
        continue-on-error: true
